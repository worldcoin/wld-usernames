name: Username nullifier tests

on:
  pull_request:
    paths: ["src/**", "migrations/**", "Cargo.*", "tests/test_nullifier_uniqueness.sh", ".github/workflows/username-nullifier-tests.yml"]
  push:
    branches: [main]
    paths: ["src/**", "migrations/**", "Cargo.*", "tests/test_nullifier_uniqueness.sh", ".github/workflows/username-nullifier-tests.yml"]

permissions:
  contents: read

jobs:
  nullifier-regression:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: usernames_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:test@localhost:5432/usernames_test
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/usernames_test
      TEST_REDIS_URL: redis://localhost:6379
      REDIS_URL: redis://localhost:6379
      ALLOW_NULLIFIER_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@df81861324dc13be452535ce5e5c4456c25496bf # 1.86.0
        with:
          toolchain: 1.86.0
          components: rustfmt, clippy
      - name: Database regression (including pre-fix reproduction)
        run: bash tests/test_nullifier_uniqueness.sh
      - name: Full Rust test suite
        run: cargo test --locked
      - name: Username API regression
        if: always()
        run: cargo test --locked routes::api::v1::nullifier_tests -- --ignored
      - name: Clippy
        if: always()
        run: cargo clippy --locked --all-targets
      - name: Formatting
        if: always()
        run: cargo fmt --check
